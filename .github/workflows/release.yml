name: Release

# Pushing a `vX.Y.Z` tag is what releases. The owner pushes the tag; everything
# below happens here, never from a laptop. If this workflow is red on a tag,
# the release has not happened: delete the tag rather than fixing it in place.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag, not a branch: the artifact is built from exactly what was
      # tagged, even if main has moved on since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.16" # the floor package.json declares, and what CI proves
          # No package-manager cache in the publishing job: the OIDC token that
          # publishes to npm lives in this same job, and a poisoned cache would
          # be restored into it. setup-node's own trusted-publishing guide asks
          # for this. The cost is one uncached `npm ci` per release.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs npm 11.5 or newer, and the
      # npm bundled with Node 22.16 is 10.9.2. Pinned to 11 rather than latest:
      # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0, above the 22.16
      # floor this package declares and this workflow runs on, so `@latest`
      # fails to install here (measured 2026-09-19, npm 12.0.2, EBADENGINE).
      - name: Use an npm that can publish with OIDC
        run: |
          npm install -g npm@11
          have="$(npm --version)"
          echo "npm $have"
          # Fail here, with a sentence that says what is wrong, rather than at
          # the publish step with an authentication error nobody can read.
          # 11.5.1 is the floor setup-node's own trusted-publishing guide
          # states; below it the publish fails even with OIDC set up correctly.
          if [ "$(printf '%s\n%s\n' "11.5.1" "$have" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $have cannot publish with OIDC; 11.5.1 or newer is required"
            exit 1
          fi

      - run: npm ci

      # The tag says what this release is; package.json is what npm would
      # publish, and src/version.ts reports it to every MCP client. A mismatch
      # means the release commit was not the one tagged, so stop before
      # anything is published or announced.
      - name: The tag and package.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg"
            exit 1
          fi
          # server.json is what the MCP Registry step below publishes; it
          # must describe this same version, or the registry entry would
          # point at a different npm release than the one just published.
          for v in "$(node -p 'require("./server.json").version')" \
                   "$(node -p 'require("./server.json").packages.find(p => p.registryType === "npm").version')"; do
            if [ "$v" != "$tag" ]; then
              echo "tag $GITHUB_REF_NAME says $tag, server.json says $v"
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # The same checks CI runs on every push, once more on the tagged commit.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: The tarball carries dist/ and nothing from tests/
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "dist/index.js" /tmp/pack.txt || { echo "dist/ missing from the tarball"; exit 1; }
          if grep -qE "tests/|fixtures/|\.local-fixtures/|docs/superpowers/" /tmp/pack.txt; then
            echo "test files or private documents leaked into the tarball"; exit 1
          fi

      # Release notes are the changelog entry, copied verbatim -- never
      # generated from commit titles. A version with no entry is a release
      # nobody wrote notes for, so fail instead of publishing a blank one.
      - name: Take this version's entry out of the changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Stop at the next version heading, or at the link definitions at the
          # foot of the file: for the newest version those definitions would
          # otherwise be swept into the notes and then appended again below.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "CHANGELOG.md has no entry for $version"
            exit 1
          fi
          # The entry may use reference-style links ([#14]); their definitions
          # live at the foot of the changelog. Without them the notes would
          # render "[#14]" as plain text. Unused definitions render as nothing.
          grep -E '^\[[^]]+\]: ' CHANGELOG.md >> /tmp/notes.md
          cat /tmp/notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --verify-tag

      # A version can already be on the registry: 0.1.0 was published by hand
      # before this workflow existed, and re-running a tag's workflow is a
      # normal thing to do. npm refuses to publish over an existing version,
      # which would fail the run after the GitHub Release was already created,
      # so ask the registry first. Only an exact version match skips the
      # publish; anything else -- no such package, no such version, a registry
      # error -- leaves the answer empty and the publish goes ahead.
      - name: Is this version already on npm?
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          found="$(npm view "serato-dj-mcp@$version" version 2>/dev/null || true)"
          if [ "$found" = "$version" ]; then
            echo "already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "not on the registry yet, publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npm verifies this repository and this workflow file
      # through OIDC, so there is no token to store, rotate or leak. Provenance
      # ties the published tarball to this run. Skipped when the step above
      # found this exact version already on the registry.
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # The official MCP Registry lists this server as
      # io.github.Venut-Technologies/serato-dj-mcp and points clients at the
      # npm package, so it goes after npm. mcp-publisher is pinned to a
      # release and checked against the sha256 that release publishes in
      # registry_1.8.1_checksums.txt; moving to a new version means reading
      # its notes and replacing both lines.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          /tmp/mcp-publisher --version

      # Same reasoning as the npm check above: re-running a tag's workflow
      # must not fail on a version the registry already has (it answers a
      # duplicate with HTTP 400). Only a 200 for this exact name and version
      # skips; a 404 or anything else goes on to publish, which then says
      # what is wrong.
      - name: Is this version already in the MCP Registry?
        id: registry
        run: |
          version="${{ steps.version.outputs.version }}"
          name="$(node -p 'encodeURIComponent(require("./server.json").name)')"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/${name}/versions/${version}" || true)"
          if [ "$status" = "200" ]; then
            echo "already in the registry, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry answered $status, publishing"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The registry verifies the listing against this version's metadata on
      # npm (its mcpName must match), and a version published seconds ago may
      # not be visible yet. Wait for it rather than fail on a race.
      - name: Wait until npm serves this version
        if: steps.registry.outputs.skip != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          for i in $(seq 1 30); do
            if [ "$(npm view "serato-dj-mcp@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "npm serves $version"
              exit 0
            fi
            sleep 10
          done
          echo "npm still does not serve $version after five minutes"
          exit 1

      # GitHub OIDC, like npm: the registry trusts this repository's
      # workflow for the io.github.Venut-Technologies namespace, so there is
      # no token to store. An interactive login into the organisation's
      # namespace is refused (registry issues #1649, #1537); this is the path
      # that works.
      - name: Publish to the MCP Registry
        if: steps.registry.outputs.skip != 'true'
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish server.json
