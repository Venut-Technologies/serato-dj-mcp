name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 22.16 is the declared floor: backup() from node:sqlite lands there.
        # Declaring a floor without running on it is a guess.
        #
        # ubuntu-latest is deliberately not pinned: the point is to find out
        # when a newer image breaks us. GitHub moves that label to Ubuntu 26
        # from 2026-10-19, so a CI failure on Linux around that date is the
        # image changing under us, not the commit that happened to be pushed.
        os: [macos-latest, ubuntu-latest]
        node: ["22.16", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run lint
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Tarball carries dist and nothing else
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const f = require('./pack.json')[0].files.map(x => x.path);
            if (!f.includes('dist/index.js')) { console.error('dist/index.js missing'); process.exit(1); }
            const leaked = f.filter(p => p.startsWith('tests/') || p.includes('.local-fixtures'));
            if (leaked.length) { console.error('leaked: ' + leaked.join(', ')); process.exit(1); }
            console.log('tarball ok, ' + f.length + ' files');
          "
      # The release workflow publishes server.json to the MCP Registry right
      # after npm, and the registry refuses a listing whose npm package does
      # not carry the same name. A version bumped in one file and not the
      # other would only surface there, after npm already has the release.
      - name: server.json matches package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const srv = require('./server.json');
            const npm = srv.packages.filter(p => p.registryType === 'npm');
            const problems = [];
            if (srv.name !== pkg.mcpName) problems.push('name ' + srv.name + ' vs mcpName ' + pkg.mcpName);
            if (srv.version !== pkg.version) problems.push('version ' + srv.version + ' vs ' + pkg.version);
            if (npm.length !== 1) problems.push(npm.length + ' npm packages, expected 1');
            for (const p of npm) {
              if (p.identifier !== pkg.name) problems.push('identifier ' + p.identifier + ' vs ' + pkg.name);
              if (p.version !== pkg.version) problems.push('npm package version ' + p.version + ' vs ' + pkg.version);
            }
            if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
            console.log('server.json ' + srv.version + ' matches package.json');
          "
